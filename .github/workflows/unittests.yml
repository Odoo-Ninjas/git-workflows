# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Run Unittests for repository

permissions: write-all

on:
  workflow_call:
    inputs:
      projectname:
        type: string
        required: true
      enabled:
        required: true
        type: string
jobs:
  run_tests:
    runs-on:
      - self-hosted
      # - marc-laptop
    concurrency:
      group: unittests-${{ github.workflow }}-${{ github.ref }}-unittests
      cancel-in-progress: true

    steps:
      - name: Welcome robotests
        run: |
          echo "Welcome to robotesting"

      - name: Checkout
        uses: actions/checkout@v4

      - name: preparation steps
        uses: Odoo-Ninjas/git-workflows/actions/prepare_repo@v9
        with:
          enabled: ${{ inputs.enabled }}
          build: ${{ inputs.enabled }}
          project_name_prefix: ${{ inputs.projectname}}_unittests

      - name: run tests
        if: ${{ inputs.enabled }}
        run: |
          ./odoobin up -d postgres || true
          ./odoobin up -d postgres
          ./odoobin -f run-tests

      - name: cleanup docker
        if: always()
        run: |
          if "${{ inputs.ENABLED }}"; then
            ./odoobin -f kill
            ./odoobin -f down -v
          fi
